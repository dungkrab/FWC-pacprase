        }

            margin: 0;

            height: 100%;

            grid-template-columns: 1fr 1fr;

            height: 100vh;

            background: green;
            color: black;
            display: flex;
            align-items: center;

            font-size: 2rem;
        }

        .right {
            background: pink;
            color: black;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            font-size: 2rem;
        }
    </style>
</head>

<body>
    <hr>

        <div class="left">Left</div>
        <div class="right">Right</div>
    </div>
