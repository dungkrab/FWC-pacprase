<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
        }
        .title {
            font-size: 40px;
            text-align: center;
            color: white;
        }
        img {
            width: 400px;
            height: 100px;
        }
        .shop-container {
            display: flex;
            justify-content: center;
            gap: 30px;
        }
        .shop {
            text-align: center;
        }
        .copyright {
            text-align: right;
            font-family: monospace;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1 class="title">Piscine Web !</h1>
    <div class="shop-container">
        <div class="shop">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/fe/Shopee.svg">
            <br>
            <a href="https://shopee.co.th">Shopee</a>
        </div>

        <div class="shop">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/4d/Lazada_%282019%29.svg">
            <br>
            <a href="https://www.lazada.co.th">Lazada</a>
        </div>
    </div>
    <hr>
    <p class="copyright">
        © pacprase 2026
    </p>
</body>
</html>
