<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>
    <div class="card">
        <header>
            User Profile Card
        </header>
        <table>
            <tr>
                <td>
                    <img class="profile" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQUvqgumbt4BBov8E_zxOO_Cbe14_mRrCJ1ha0_w4l7nKPRT78R9Gy5jpg&s=10" alt="Profile picture">
                </td>
            </tr>

            <tr>
                <td>
                    <h2>เอ็ม ออนิว</h2>
                    <p>I love you ปูเป้เพชรบุรีครับผมมม</p>
                </td>
            </tr>

            <tr>
                <td>
                    <div class="socials">
                        <a href="https://github.com" target="_blank">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c2/GitHub_Invertocat_Logo.svg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original" alt="GitHub">
                        </a>

                        <a href="https://www.linkedin.com" target="_blank">
                            <img src="https://play-lh.googleusercontent.com/oij55bxj3e-4JrhGntpki0lnQyE8yQn8X5FPEzZ0t7cLppeiSINynEk7n9COoh7QSaCOZ_yiPO31NVaW4SDbWg=s256-rw" alt="LinkedIn">
                        </a>

                        <a href="https://www.instagram.com" target="_blank">
                            <img src="https://www.knmasters.com/wp-content/uploads/2025/03/Instagram_logo_2022.svg" alt="Instagram">
                        </a>
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    <a class="contact">
                        Contact
                    </a>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
